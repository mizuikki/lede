name: OpenWrt-CI

on:
  workflow_dispatch:
    inputs:
      build_reason:
        description: Build reason
        required: false
        default: manual
      source_sha:
        description: Full commit SHA to build (empty uses the selected workflow ref)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: openwrt-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  PROFILE_NAME: x86_64-passwall-docker
  HISTORY_RELEASE_PREFIX: build
  HISTORY_RETENTION_DAYS: "30"
  RELEASE_TAG: latest
  RELEASE_NAME: Latest x86_64 Passwall Docker Build

jobs:

  build_openwrt:

    name: Build OpenWrt Firmware

    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Resolve build source
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "${WORKFLOW_SHA}^{commit}"; then
            git fetch --no-tags origin "$WORKFLOW_SHA"
          fi
          git show "${WORKFLOW_SHA}:scripts/ci-source-info.sh" > "$RUNNER_TEMP/ci-source-info.sh"
          bash "$RUNNER_TEMP/ci-source-info.sh" >> "$GITHUB_OUTPUT"

      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          mapfile -t purge_packages < <(
            dpkg-query -W -f='${binary:Package}\n' | grep -E '^(azure-cli|docker|ghc|zulu|llvm|firefox|google|dotnet|powershell|openjdk|mysql|php|mongodb|snap)'
          )
          if [[ "${#purge_packages[@]}" -gt 0 ]]; then
            sudo -E apt -y purge "${purge_packages[@]}"
          else
            echo "No matching preinstalled packages found for purge"
          fi
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Update feeds and generate configuration file
        run: ./scripts/apply-profile.sh "${PROFILE_NAME}" --sync-all-feeds

      - name: Download packages
        run: make download -j16

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Prepare release assets
        id: prepare_release
        env:
          BUILD_REASON: ${{ inputs.build_reason || 'manual' }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          set -euo pipefail

          build_reason="$BUILD_REASON"
          build_stamp="$(date -u +'%Y%m%d-%H%M%S')"
          build_date="$(date -u +'%Y-%m-%d %H:%M:%SZ')"
          short_sha="$SOURCE_SHORT_SHA"
          release_dir="${GITHUB_WORKSPACE}/release-assets"
          metadata_dir="${GITHUB_WORKSPACE}/release-metadata"
          notes_file="${GITHUB_WORKSPACE}/release-notes.md"
          history_tag="${HISTORY_RELEASE_PREFIX}-${build_stamp}-${short_sha}"
          history_name="Build ${build_stamp} (${short_sha})"

          rm -rf "${release_dir}" "${metadata_dir}"
          mkdir -p "${release_dir}" "${metadata_dir}"

          if [[ ! -d ./bin/targets ]]; then
            echo "bin/targets not found" >&2
            exit 1
          fi

          if [[ ! -d ./bin/packages ]]; then
            echo "bin/packages not found" >&2
            exit 1
          fi

          firmware_archive="openwrt-${PROFILE_NAME}-firmware-${build_stamp}.tar.gz"
          packages_archive="openwrt-${PROFILE_NAME}-packages-${build_stamp}.tar.gz"
          buildinfo_archive="openwrt-${PROFILE_NAME}-buildinfo-${build_stamp}.tar.gz"
          metadata_file="openwrt-${PROFILE_NAME}-metadata-${build_stamp}.txt"
          checksum_file="openwrt-${PROFILE_NAME}-sha256sums-${build_stamp}.txt"

          tar --exclude='targets/*/*/packages' -C ./bin -czf "${release_dir}/${firmware_archive}" targets
          tar -C ./bin -czf "${release_dir}/${packages_archive}" packages

          while IFS= read -r -d '' file; do
            install -D "${file}" "${metadata_dir}/${file#./bin/}"
          done < <(find ./bin/targets -type f \( -name '*.buildinfo' -o -name '*.manifest' -o -name 'sha256sums' \) -print0)

          if [[ -z "$(find "${metadata_dir}" -type f -print -quit)" ]]; then
            echo "No build metadata files were produced" >&2
            exit 1
          fi

          tar -C "${metadata_dir}" -czf "${release_dir}/${buildinfo_archive}" .

          cat > "${release_dir}/${metadata_file}" <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Workflow: ${GITHUB_WORKFLOW}
          Run ID: ${GITHUB_RUN_ID}
          Run Attempt: ${GITHUB_RUN_ATTEMPT}
          Workflow Ref: ${GITHUB_REF}
          Workflow Commit: ${GITHUB_WORKFLOW_SHA}
          Dispatch Commit: ${GITHUB_SHA}
          Commit: ${SOURCE_SHA}
          Short Commit: ${short_sha}
          Profile: ${PROFILE_NAME}
          Build Reason: ${build_reason}
          Built At (UTC): ${build_date}
          EOF

          (
            cd "${release_dir}"
            sha256sum ./* > "${checksum_file}"
          )

          cat > "${notes_file}" <<EOF
          Automated build for \`${PROFILE_NAME}\`.

          - Repository: \`${GITHUB_REPOSITORY}\`
          - Workflow ref: \`${GITHUB_REF}\`
          - Workflow commit: \`${GITHUB_WORKFLOW_SHA}\`
          - Dispatch commit: \`${GITHUB_SHA}\`
          - Commit: \`${SOURCE_SHA}\`
          - Short Commit: \`${short_sha}\`
          - Build Reason: \`${build_reason}\`
          - Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Built at (UTC): \`${build_date}\`
          EOF

          {
            echo "build_stamp=${build_stamp}"
            echo "history_tag=${history_tag}"
            echo "history_name=${history_name}"
            echo "release_dir=${release_dir}"
            echo "notes_file=${notes_file}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check release eligibility
        id: release_gate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
            git fetch --no-tags origin \
              "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          fi
          bash "$RUNNER_TEMP/ci-source-info.sh" >> "$GITHUB_OUTPUT"

      - name: Upload candidate build artifacts
        if: steps.release_gate.outputs.publish_release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ env.PROFILE_NAME }}-${{ steps.source.outputs.short_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare_release.outputs.release_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish history release
        if: steps.release_gate.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          release_dir="${{ steps.prepare_release.outputs.release_dir }}"
          notes_file="${{ steps.prepare_release.outputs.notes_file }}"
          history_tag="${{ steps.prepare_release.outputs.history_tag }}"
          history_name="${{ steps.prepare_release.outputs.history_name }}"

          mapfile -t assets < <(find "${release_dir}" -maxdepth 1 -type f | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets prepared" >&2
            exit 1
          fi

          gh release create "${history_tag}" "${assets[@]}" \
            --title "${history_name}" \
            --notes-file "${notes_file}" \
            --target "${SOURCE_SHA}" \
            --latest=false

      - name: Publish latest release
        if: steps.release_gate.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          release_dir="${{ steps.prepare_release.outputs.release_dir }}"
          notes_file="${{ steps.prepare_release.outputs.notes_file }}"

          mapfile -t assets < <(find "${release_dir}" -maxdepth 1 -type f | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets prepared" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}"

            declare -A keep_assets=()
            for asset_path in "${assets[@]}"; do
              keep_assets["$(basename "${asset_path}")"]=1
            done

            while IFS= read -r asset_name; do
              if [[ -z "${keep_assets[${asset_name}]:-}" ]]; then
                gh release delete-asset "${RELEASE_TAG}" "${asset_name}" --yes
              fi
            done < <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')

            git tag -f "${RELEASE_TAG}" "${SOURCE_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}" --force

            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file "${notes_file}" \
              --latest
          else
            git tag -f "${RELEASE_TAG}" "${SOURCE_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}" --force

            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --title "${RELEASE_NAME}" \
              --notes-file "${notes_file}" \
              --verify-tag \
              --latest
          fi

      - name: Delete history releases older than retention window
        if: steps.release_gate.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d "${HISTORY_RETENTION_DAYS} days ago" +%s)"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | [.tag_name, .created_at] | @tsv' |
          while IFS=$'\t' read -r tag_name created_at; do
            if [[ "${tag_name}" == "${RELEASE_TAG}" ]]; then
              continue
            fi

            if [[ "${tag_name}" != "${HISTORY_RELEASE_PREFIX}-"* ]]; then
              continue
            fi

            created_epoch="$(date -u -d "${created_at}" +%s)"
            if (( created_epoch >= cutoff_epoch )); then
              continue
            fi

            gh release delete "${tag_name}" --cleanup-tag --yes
          done
