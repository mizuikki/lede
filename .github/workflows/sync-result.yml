name: Sync-Result

on:
  workflow_run:
    workflows:
      - OpenWrt-CI
    types:
      - completed
  issue_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: sync-result-${{ github.event.workflow_run.id || format('pr-{0}', github.event.issue.number) }}
  cancel-in-progress: false

jobs:
  aggregate:
    name: Aggregate trusted build result
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.repository.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout result controller from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact run, attempt, jobs, artifact, and current PR
        id: result
        run: python3 scripts/sync-result.py --output sync-result.json

      - name: Upload aggregation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-result-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: sync-result.json
          if-no-files-found: warn
          retention-days: 14
